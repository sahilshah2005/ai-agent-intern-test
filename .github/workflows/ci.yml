name: CI

on:
  push:
    branches: [main, second-phase-upgrade]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Lint with ruff
        run: ruff check src/ tests/ evaluation/ cli.py

      # Evaluation suite is skipped in CI because it requires
      # an OPENAI_API_KEY. Run it locally with:
      #   python evaluation/run_eval.py --cases all --report-json evaluation/results.json
